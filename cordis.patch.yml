# dsh-apradar bundle patch
#
# 这是 `package.json` 里 `dsh.bundle.patch` 指向的文件。`dsh plugin --profile <name> add <本包>`
# 时，CLI 会读它并把下面这行挂进 profile 的 bundle 栈；手工在
# `~/.dsh/profiles/<name>/cordis.patch.yml` 里补同样的两行也等效。
#
# 注意：**真正决定本插件是否加载的是 profile 的 `package.json`**
# （`dsh.profile.bundles` 数组 + `dependencies` 里的 `link:` 声明），不是这个文件本身。
#
# 与技术验证 Spike（`spike/apradar-spike/cordis.patch.yml`，id `dsh-apradar-spike`）**id 不同**，
# 两者可以同时装在一个 Profile 里而不互相覆盖。
- insert:
    - id: dsh-apradar
      name: 'dsh-apradar'
