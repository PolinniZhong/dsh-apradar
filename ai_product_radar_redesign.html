<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI 产品雷达 · Knit 风格改版 Demo</title>
<style>
  :root {
    color-scheme: light;
    --canvas: #f5f5f2;
    --surface: #ffffff;
    --surface-soft: #fafaf8;
    --text: #242522;
    --text-secondary: #6f716b;
    --text-muted: #969890;
    --line: #e7e8e2;
    --line-strong: #d4d6ce;
    --accent: #356c60;
    --accent-soft: #edf4f1;
    --success: #477a5a;
    --warning: #956b2e;
    --danger: #a4524d;
    --danger-soft: #fbf3f1;
    --added: #477a5a;
    --removed: #a4524d;
    --focus: #86a99e;
    --shadow: 0 1px 2px rgba(20, 24, 20, .04), 0 14px 40px rgba(20, 24, 20, .07);
  }
  html[data-theme="dark"] {
    color-scheme: dark;
    --canvas: #171916;
    --surface: #20221f;
    --surface-soft: #252824;
    --text: #e8e9e4;
    --text-secondary: #b0b3a9;
    --text-muted: #858a80;
    --line: #353a33;
    --line-strong: #4a5047;
    --accent: #9bc4b6;
    --accent-soft: #293832;
    --success: #8fc59b;
    --warning: #d4b17a;
    --danger: #dc928a;
    --danger-soft: #392a28;
    --added: #8fc59b;
    --removed: #dc928a;
    --focus: #668d80;
    --shadow: 0 2px 5px rgba(0,0,0,.22), 0 18px 50px rgba(0,0,0,.28);
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    padding: 22px 16px 44px;
    background: var(--canvas);
    color: var(--text);
    font: 13px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; }
  button { color: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px;
  }
  button:disabled { opacity: .48; cursor: not-allowed; }
  .stage { max-width: 780px; margin: 0 auto; }

  /* Preview controls are explicitly outside the product UI. */
  .preview-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 0 auto 12px; max-width: 720px; color: var(--text-muted); font-size: 11px;
  }
  .preview-label { display: flex; align-items: center; gap: 8px; min-width: 0; letter-spacing: .025em; }
  .preview-mark { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .preview-controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  .preview-group { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .preview-group > span { margin-right: 3px; }
  .preview-button {
    border: 0; background: transparent; padding: 3px 5px; border-radius: 4px;
    color: var(--text-secondary); cursor: pointer; font-size: 11px;
  }
  .preview-button:hover { background: var(--line); color: var(--text); }
  .preview-button.active { color: var(--text); text-decoration: underline; text-underline-offset: 4px; text-decoration-color: var(--accent); }

  .panel {
    width: 430px; max-width: 100%; height: min(800px, calc(100vh - 94px)); min-height: 540px;
    margin: 0 auto; display: flex; flex-direction: column; overflow: hidden;
    background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: var(--shadow);
    transition: width .18s ease;
  }
  .panel.wide { width: 690px; }
  .app-head { flex: none; display: flex; align-items: center; gap: 10px; padding: 13px 15px 11px; }
  .radar-glyph { width: 23px; height: 23px; border: 1px solid var(--line-strong); border-radius: 6px; position: relative; flex: none; overflow: hidden; }
  .radar-glyph::before, .radar-glyph::after { content: ""; position: absolute; border: 1px solid var(--line-strong); border-radius: 50%; }
  .radar-glyph::before { width: 13px; height: 13px; left: 4px; top: 4px; }
  .radar-glyph::after { width: 4px; height: 4px; left: 9px; top: 9px; background: var(--accent); border-color: var(--accent); }
  .app-title { min-width: 0; }
  .app-title h1 { margin: 0; font-size: 14px; line-height: 1.35; font-weight: 650; letter-spacing: -.01em; }
  .app-title p { margin: 2px 0 0; font-size: 10.5px; color: var(--text-muted); }
  .head-actions { margin-left: auto; display: flex; align-items: center; gap: 4px; flex: none; }
  .text-button {
    border: 0; background: transparent; padding: 5px 7px; border-radius: 4px;
    color: var(--text-secondary); cursor: pointer; font-size: 11.5px; white-space: nowrap;
  }
  .text-button:hover { background: var(--surface-soft); color: var(--text); }
  .text-button.strong { color: var(--text); font-weight: 600; }
  .text-button .spin { display: inline-block; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .statusbar {
    flex: none; min-height: 30px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
    padding: 6px 15px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
    color: var(--text-muted); font-size: 10.5px; background: var(--surface-soft);
  }
  .status-sep { color: var(--line-strong); }
  .status-link { padding: 0; border: 0; background: transparent; color: var(--warning); cursor: pointer; }
  .status-link:hover { text-decoration: underline; text-underline-offset: 3px; }
  .demo-disclaimer { margin-left: auto; color: var(--text-muted); font-size: 10px; }

  .nav-tabs { display: flex; flex: none; gap: 20px; padding: 0 15px; border-bottom: 1px solid var(--line); }
  .nav-tabs button {
    position: relative; display: inline-flex; align-items: center; gap: 5px;
    border: 0; background: transparent; padding: 11px 0 10px; margin-bottom: -1px;
    color: var(--text-secondary); font-size: 12px; cursor: pointer; white-space: nowrap;
  }
  .nav-tabs button:hover { color: var(--text); }
  .nav-tabs button.active { color: var(--text); font-weight: 620; }
  .nav-tabs button.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--text); }
  .nav-count { color: var(--text-muted); font-size: 10px; font-variant-numeric: tabular-nums; }
  main { min-height: 0; flex: 1; overflow: auto; overscroll-behavior: contain; }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: var(--line-strong); border: 2px solid var(--surface); border-radius: 8px; }

  .toolbar { padding: 10px 15px 9px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 9px; }
  .status-filters { display: flex; align-items: center; gap: 13px; overflow-x: auto; scrollbar-width: none; white-space: nowrap; }
  .status-filters::-webkit-scrollbar { display: none; }
  .filter-link { flex: none; border: 0; padding: 0; background: transparent; color: var(--text-muted); font-size: 11px; cursor: pointer; }
  .filter-link:hover { color: var(--text); }
  .filter-link.active { color: var(--text); font-weight: 620; text-decoration: underline; text-decoration-color: var(--accent); text-underline-offset: 4px; }
  .filter-count { color: var(--text-muted); margin-left: 3px; font-size: 10px; font-variant-numeric: tabular-nums; }
  .toolbar-bottom { display: flex; align-items: center; gap: 7px; min-width: 0; }
  .search-wrap { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; border-bottom: 1px solid var(--line-strong); padding: 3px 0 4px; }
  .search-icon { color: var(--text-muted); font-size: 14px; line-height: 1; }
  input[type="search"] { min-width: 0; flex: 1; width: 100%; border: 0; outline: 0; background: transparent; color: var(--text); padding: 0; font-size: 11.5px; }
  input[type="search"]::placeholder { color: var(--text-muted); }
  .select-minimal { width: auto; max-width: 115px; padding: 4px 2px 4px 6px; color: var(--text-secondary); background: transparent; border: 0; font-size: 10.5px; }
  .select-minimal option { background: var(--surface); color: var(--text); }
  .list-head { display: flex; align-items: center; gap: 8px; padding: 7px 15px 6px; color: var(--text-muted); font-size: 10px; }
  .list-head .total { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .list-head .push { margin-left: auto; }

  ul.change-list { list-style: none; margin: 0; padding: 0; }
  .change-row { border-bottom: 1px solid var(--line); padding: 12px 15px 12px; cursor: pointer; position: relative; }
  .change-row:hover { background: var(--surface-soft); }
  .change-row:focus-visible { outline-offset: -3px; }
  .change-row.is-ignored { opacity: .62; }
  .row-top { display: flex; align-items: center; gap: 6px; min-width: 0; color: var(--text-secondary); font-size: 10.5px; line-height: 1.4; }
  .unread-mark { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); flex: none; }
  .unread-mark.hidden { visibility: hidden; }
  .row-product { color: var(--text-secondary); font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-slash { color: var(--line-strong); }
  .row-type { color: var(--text-muted); white-space: nowrap; }
  .row-time { margin-left: auto; color: var(--text-muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .row-status { color: var(--text-muted); font-size: 10px; white-space: nowrap; }
  .row-status.warn { color: var(--warning); }
  .change-row h3 { margin: 7px 0 5px; font-size: 13px; line-height: 1.5; font-weight: 590; letter-spacing: -.005em; }
  .row-summary { margin: 0; color: var(--text-secondary); font-size: 11.5px; line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .row-bottom { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-top: 8px; color: var(--text-muted); font-size: 10.5px; }
  .row-bottom .spacer { flex: 1; }
  .diff-mini { display: inline-flex; gap: 5px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; }
  .diff-mini .add { color: var(--added); }
  .diff-mini .remove { color: var(--removed); }
  .quiet-link { border: 0; padding: 0; background: transparent; color: var(--text-secondary); cursor: pointer; font-size: 10.5px; }
  .quiet-link:hover { color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  .footnote { padding: 10px 15px; color: var(--text-muted); font-size: 10.5px; line-height: 1.6; }
  .footnote button { margin-left: 4px; }

  .detail-nav { padding: 10px 15px 0; }
  .back-link { border: 0; background: transparent; padding: 0; color: var(--text-secondary); font-size: 11px; cursor: pointer; }
  .back-link:hover { color: var(--text); }
  .detail-title { padding: 10px 15px 13px; border-bottom: 1px solid var(--line); }
  .detail-title h2 { margin: 0 0 7px; font-size: 17px; font-weight: 620; line-height: 1.45; letter-spacing: -.015em; }
  .detail-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--text-muted); font-size: 10.5px; }
  .detail-sub a { color: var(--text-secondary); text-decoration: none; border-bottom: 1px solid var(--line-strong); }
  .detail-sub a:hover { color: var(--accent); }
  .detail-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
  .action-select { background: transparent; color: var(--text-secondary); border: 1px solid var(--line); border-radius: 4px; padding: 4px 7px; font-size: 10.5px; }
  .detail-section { padding: 13px 15px 14px; border-bottom: 1px solid var(--line); }
  .detail-section h4 { margin: 0 0 9px; color: var(--text-muted); font-size: 10.5px; font-weight: 620; letter-spacing: .035em; }
  .fact-table { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 6px 10px; font-size: 11.5px; }
  .fact-table .key { color: var(--text-muted); }
  .fact-table .value { min-width: 0; overflow-wrap: anywhere; color: var(--text-secondary); }
  .fact-table .value a { color: var(--accent); text-decoration: none; }
  .fact-table .value a:hover { text-decoration: underline; }
  .source-quote { margin: 0; padding: 2px 0 2px 11px; border-left: 2px solid var(--line-strong); color: var(--text-secondary); font-size: 11.5px; line-height: 1.75; }
  .quote-by { display: block; margin-top: 6px; color: var(--text-muted); font-size: 10px; }
  .diff-box { font: 10.5px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace; overflow: hidden; }
  .diff-line { display: flex; gap: 9px; padding: 3px 7px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .diff-line.context { color: var(--text-muted); }
  .diff-line.add { color: var(--added); background: color-mix(in srgb, var(--added) 7%, transparent); }
  .diff-line.remove { color: var(--removed); background: color-mix(in srgb, var(--removed) 6%, transparent); }
  .diff-sign { flex: none; width: 9px; opacity: .8; }
  .subtle-note { margin-top: 7px; color: var(--text-muted); font-size: 10px; line-height: 1.6; }
  .evidence-block { padding: 0 0 0 11px; margin: 0 0 12px; border-left: 2px solid var(--line-strong); }
  .evidence-block:last-child { margin-bottom: 0; }
  .evidence-label { color: var(--text); font-size: 10.5px; font-weight: 620; margin-bottom: 4px; }
  .evidence-block p { margin: 0; color: var(--text-secondary); font-size: 11.5px; line-height: 1.7; }
  .evidence-block.inference { border-left-style: dashed; border-left-color: var(--warning); }
  .evidence-block.inference .evidence-label { color: var(--warning); }
  .note-area { width: 100%; min-height: 68px; resize: vertical; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-soft); color: var(--text); padding: 8px 9px; font-size: 11.5px; line-height: 1.6; }
  .save-row { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
  .save-status { color: var(--text-muted); font-size: 10px; }

  .section-bar { display: flex; align-items: center; padding: 10px 15px 8px; color: var(--text-muted); font-size: 10.5px; }
  .section-bar strong { color: var(--text-secondary); font-weight: 600; }
  .section-bar .right { margin-left: auto; }
  .source-row { padding: 12px 15px; border-bottom: 1px solid var(--line); }
  .source-top { display: flex; align-items: baseline; gap: 7px; min-width: 0; }
  .source-name { font-size: 12.5px; font-weight: 620; min-width: 0; overflow-wrap: anywhere; }
  .source-kind { color: var(--text-muted); font-size: 10px; white-space: nowrap; }
  .source-enabled { margin-left: auto; color: var(--text-muted); font-size: 10px; white-space: nowrap; }
  .source-enabled.active { color: var(--success); }
  .source-url { display: block; margin-top: 3px; color: var(--text-muted); font-size: 10.5px; overflow-wrap: anywhere; text-decoration: none; }
  .source-url:hover { color: var(--accent); }
  .source-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 7px; margin-top: 6px; color: var(--text-muted); font-size: 10px; }
  .source-error { margin-top: 8px; padding: 7px 0 1px 10px; border-left: 2px solid var(--danger); color: var(--danger); font-size: 10.5px; line-height: 1.6; }
  .source-actions { display: flex; flex-wrap: wrap; gap: 11px; margin-top: 8px; }
  .source-actions button { font-size: 10.5px; }
  .template-row { display: flex; align-items: center; gap: 8px; padding: 9px 15px; border-bottom: 1px solid var(--line); }
  .template-copy { flex: 1; min-width: 0; }
  .template-copy strong { display: block; font-weight: 570; font-size: 11.5px; }
  .template-copy span { display: block; color: var(--text-muted); font-size: 10px; margin-top: 2px; }

  .opportunity-row { padding: 13px 15px 14px; border-bottom: 1px solid var(--line); }
  .opp-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; color: var(--text-muted); font-size: 10.5px; }
  .opp-state { color: var(--accent); }
  .opp-project { margin-left: auto; }
  .opportunity-row h3 { margin: 0; font-size: 13px; line-height: 1.5; font-weight: 610; }
  .opp-source { display: block; margin: 7px 0 9px; text-align: left; }
  .opp-field { margin-top: 5px; color: var(--text-secondary); font-size: 11px; line-height: 1.65; }
  .opp-field .key { color: var(--text-muted); }
  .opp-status-control { margin-top: 10px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .opp-status-control label { color: var(--text-muted); font-size: 10px; }

  .empty, .state-message { padding: 52px 22px; color: var(--text-muted); text-align: center; }
  .empty-mark { width: 32px; height: 32px; border: 1px solid var(--line-strong); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 13px; color: var(--text-secondary); font-size: 15px; }
  .empty-title { color: var(--text-secondary); font-size: 12.5px; font-weight: 600; margin-bottom: 5px; }
  .empty p, .state-message p { margin: 0 auto; max-width: 270px; font-size: 11px; line-height: 1.7; }
  .inline-button { border: 0; background: transparent; color: var(--accent); padding: 0; cursor: pointer; font-size: inherit; }
  .inline-button:hover { text-decoration: underline; text-underline-offset: 3px; }
  .skeleton { padding: 14px 15px; border-bottom: 1px solid var(--line); }
  .skeleton span { display: block; height: 7px; margin: 0 0 9px; border-radius: 2px; background: var(--line); animation: breathe 1.25s ease-in-out infinite alternate; }
  .skeleton span:nth-child(1) { width: 35%; }
  .skeleton span:nth-child(2) { width: 92%; height: 10px; }
  .skeleton span:nth-child(3) { width: 66%; margin-bottom: 0; }
  @keyframes breathe { to { opacity: .45; } }
  .bottomline { flex: none; padding: 7px 15px; border-top: 1px solid var(--line); color: var(--text-muted); font-size: 9.5px; display: flex; gap: 8px; align-items: center; }
  .bottomline .push { margin-left: auto; }
  .mini-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--success); }
  .mini-dot.warning { background: var(--warning); }

  .modal-backdrop { position: fixed; inset: 0; padding: 18px; display: flex; align-items: center; justify-content: center; background: rgba(20,22,19,.32); z-index: 10; }
  .modal-backdrop[hidden] { display: none; }
  .modal { width: min(400px, 100%); background: var(--surface); border: 1px solid var(--line-strong); border-radius: 7px; box-shadow: var(--shadow); }
  .modal-head { display: flex; align-items: center; padding: 13px 15px; border-bottom: 1px solid var(--line); }
  .modal-head h2 { margin: 0; font-size: 13px; font-weight: 620; }
  .modal-head button { margin-left: auto; }
  .modal-body { padding: 14px 15px; }
  .form-field { display: block; margin-bottom: 12px; }
  .form-field span { display: block; color: var(--text-secondary); margin-bottom: 5px; font-size: 10.5px; }
  .form-field input, .form-field select { width: 100%; border: 1px solid var(--line); border-radius: 4px; padding: 7px 8px; background: var(--surface-soft); color: var(--text); font-size: 11.5px; }
  .modal-note { color: var(--text-muted); font-size: 10px; line-height: 1.6; margin: 2px 0 13px; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 15px; border-top: 1px solid var(--line); }
  .outline-button { border: 1px solid var(--line-strong); border-radius: 4px; background: transparent; padding: 5px 10px; cursor: pointer; font-size: 11px; }
  .outline-button:hover { background: var(--surface-soft); }
  .solid-button { border: 1px solid var(--text); border-radius: 4px; background: var(--text); color: var(--surface); padding: 5px 11px; cursor: pointer; font-size: 11px; }
  .toast { position: fixed; z-index: 20; left: 50%; bottom: 22px; transform: translateX(-50%); max-width: calc(100% - 30px); padding: 8px 12px; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--surface); color: var(--text-secondary); font-size: 11px; box-shadow: var(--shadow); }
  .toast[hidden] { display: none; }

  @media (max-width: 520px) {
    body { padding: 12px 8px 24px; }
    .preview-head { align-items: flex-start; flex-direction: column; gap: 5px; padding: 0 2px; }
    .preview-controls { justify-content: flex-start; }
    .panel { width: 100%; height: calc(100vh - 100px); min-height: 500px; border-radius: 7px; }
    .panel.wide { width: 100%; }
    .app-head { padding-left: 12px; padding-right: 10px; }
    .statusbar { padding-left: 12px; padding-right: 12px; }
    .nav-tabs { padding-left: 12px; gap: 18px; }
    .toolbar { padding-left: 12px; padding-right: 12px; }
    .change-row, .source-row, .opportunity-row { padding-left: 12px; padding-right: 12px; }
    .detail-nav, .detail-title, .detail-section, .section-bar, .template-row, .footnote, .list-head { padding-left: 12px; padding-right: 12px; }
    .demo-disclaimer { display: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="preview-head" aria-label="原型预览控制，不属于产品界面">
    <div class="preview-label"><span class="preview-mark"></span><span>AI PRODUCT RADAR</span><span>／ 界面评审原型</span></div>
    <div class="preview-controls">
      <div class="preview-group"><span>外观</span><button class="preview-button active" data-theme="light">浅色</button><button class="preview-button" data-theme="dark">深色</button></div>
      <div class="preview-group"><span>宽度</span><button class="preview-button active" data-width="narrow">侧栏</button><button class="preview-button" data-width="wide">宽屏</button></div>
      <div class="preview-group"><span>状态</span><button class="preview-button active" data-preview="normal">正常</button><button class="preview-button" data-preview="loading">加载</button><button class="preview-button" data-preview="empty">空</button><button class="preview-button" data-preview="fail">失败</button></div>
    </div>
  </div>

  <section class="panel" id="panel" aria-label="AI 产品雷达演示面板">
    <header class="app-head">
      <span class="radar-glyph" aria-hidden="true"></span>

}

function renderSkeleton(n=4) { return Array.from({length:n}, () => `<div class="skeleton"><span></span><span></span><span></span></div>`).join(""); }

    <div class="source-top"><span class="source-name">${esc(s.name)}</span><span class="source-kind">${esc(typeLabels[s.type])}</span><span class="source-enabled${s.enabled ? " active" : ""}">${s.enabled ? "已启用" : "已停用"}</span></div>
    <a class="source-url" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">${esc(s.url)}</a>
    <div class="source-meta"><span>${s.status === "ok" ? "最近一次成功" : s.status === "fail" ? "最近一次失败" : "尚未检查"}：${esc(s.lastOkAt)}</span><span>·</span><span>${s.controlled ? "预设类型" : "需要适配验证"}</span></div>
    ${s.status === "fail" && s.enabled ? `<div class="source-error">${esc(s.failReason)} ${esc(s.failDetail || "")}</div>` : ""}
    <div class="source-actions"><button class="quiet-link" data-action="test-source" data-id="${esc(s.id)}">测试（模拟）</button><button class="quiet-link" data-action="toggle-source" data-id="${esc(s.id)}">${s.enabled ? "停用来源" : "启用来源"}</button><button class="quiet-link" data-action="edit-source" data-id="${esc(s.id)}">编辑</button><button class="quiet-link" data-action="remove-source" data-id="${esc(s.id)}">删除</button></div>
  </div>`).join("");
  $("main").innerHTML = `<div class="section-bar"><strong>已配置的来源</strong><span style="margin-left:5px">${sources.length}</span><button class="text-button strong right" data-action="add-source">＋ 添加来源</button></div>${rows}<div class="section-bar" style="padding-top:16px"><strong>支持范围</strong></div>
    <div class="template-row"><div class="template-copy"><strong>GitHub Releases / Atom</strong><span>适合公开发布记录；请求预算仍需控制</span></div><span class="source-kind">优先支持</span></div>
    <div class="template-row"><div class="template-copy"><strong>RSS / Atom</strong><span>限于已测试的 Feed 格式与 Fixture</span></div><span class="source-kind">受限支持</span></div>
    <div class="template-row"><div class="template-copy"><strong>公开静态页面</strong><span>需要逐站点验证解析规则；动态 / 登录页不支持</span></div><span class="source-kind">有条件</span></div>
    <div class="footnote">来源检测与外网抓取在本原型中均为模拟操作。正式插件应使用 DSH Host 的受控抓取接口，并清楚展示失败与未验证状态。</div>`;
}
function renderOpps() {
  if (!opportunities.length) {
    $("main").innerHTML = `<div class="empty"><div class="empty-mark">＋</div><div class="empty-title">机会池暂时为空</div><p>打开一条变化记录，选择“转为产品机会”，把需要进一步验证的问题沉淀下来。</p><p style="margin-top:10px"><button class="inline-button" data-action="go-inbox">查看变化列表 →</button></p></div>`;
    return;
  }
  $("main").innerHTML = `<div class="section-bar"><strong>待研究与验证</strong><span style="margin-left:5px">${opportunities.length}</span><span class="right">用户维护 · 不自动生成路线图</span></div>${opportunities.map(o => {
    const c = changeOf(o.changeId);
    return `<article class="opportunity-row"><div class="opp-top"><span class="opp-state">${esc(oppLabels[o.status])}</span><span class="opp-project">${esc(o.project)}</span></div><h3>${esc(o.title)}</h3><button class="quiet-link opp-source" data-action="open-change" data-id="${esc(o.changeId)}">↳ 来源变化：${esc(c ? c.title : "原始变化已删除")}</button>
      ${o.note ? `<div class="opp-field"><span class="key">当前判断：</span>${esc(o.note)}</div>` : ""}${o.question ? `<div class="opp-field"><span class="key">待验证：</span>${esc(o.question)}</div>` : ""}${o.nextAction ? `<div class="opp-field"><span class="key">下一步：</span>${esc(o.nextAction)}</div>` : ""}
      <div class="opp-status-control"><label for="opp-${esc(o.id)}">状态</label><select class="action-select" id="opp-${esc(o.id)}" data-action="opp-status" data-id="${esc(o.id)}">${Object.entries(oppLabels).map(([k,v]) => `<option value="${k}"${o.status === k ? " selected" : ""}>${esc(v)}</option>`).join("")}</select><button class="quiet-link" data-action="edit-opp" data-id="${esc(o.id)}">编辑记录</button></div>
    </article>`;
  }).join("")}<div class="footnote">这里保存的是你决定继续验证的产品问题，不是雷达自动生成的需求结论或版本路线图。</div>`;
}
function render() {
  setTheme(state.theme); setWidth(state.width); renderTabs(); renderStatus();
  if (state.view === "inbox") renderInbox();
  else if (state.view === "sources") renderSources();
  else renderOpps();
}
function setView(view) { state.view = view; state.detailId = null; render(); $("main").scrollTop = 0; }
function openChange(id) { state.view = "inbox"; state.detailId = id; render(); $("main").scrollTop = 0; }
function openSourceModal(id=null, preset=null) {
  state.editingSourceId = id;
  const form = $("sourceForm"); form.reset();
  const src = id ? sourceOf(id) : null;
  $("modalTitle").textContent = src ? "编辑关注源" : "添加关注源";
  form.elements.name.value = src ? src.name : (preset ? preset.name : "");
  form.elements.type.value = src ? src.type : (preset ? preset.type : "github_releases");
  form.elements.url.value = src ? src.url : (preset ? preset.url : "");
  $("modalBackdrop").hidden = false; form.elements.name.focus();
}
function closeSourceModal() { $("modalBackdrop").hidden = true; state.editingSourceId = null; }
function saveSource(form) {
  const name = form.elements.name.value.trim(); const url = form.elements.url.value.trim(); const type = form.elements.type.value;
  let parsed;
  try { parsed = new URL(url); } catch { showToast("请输入有效的来源 URL"); return; }
  if (!/^https?:$/.test(parsed.protocol)) { showToast("来源必须使用 HTTP 或 HTTPS"); return; }
  if (parsed.username || parsed.password) { showToast("来源 URL 不应包含用户名或密码"); return; }
  if (state.editingSourceId) {
    const src = sourceOf(state.editingSourceId); Object.assign(src, { name, url, type });
  } else {
    sources.unshift({ id: `s${Date.now()}`, name, url, type, enabled: true, lastOkAt: "尚未检查", status: "unknown", controlled: type !== "html_static" });
  }
  closeSourceModal(); render(); showToast("已更新演示数据；尚未访问网络");
}
function addOpportunity(c) {
  if (c.opportunityId && opportunityOf(c.opportunityId)) { setView("opps"); return; }
  const id = `o${Date.now()}`;
  opportunities.unshift({ id, title: c.title.replace(/^示例：/, "待验证："), changeId: c.id, project: "待关联项目", note: "", question: "需要核实哪些事实？", nextAction: "回到原始来源核实，并比较其他实现。", status: "research" });
  c.opportunityId = id; c.status = "opp"; setView("opps"); showToast("已加入演示机会池；尚未写入真实存储");
}
function updateSearch(value) {
  state.query = value; const input = $("changeSearch"); const pos = input ? input.selectionStart : value.length;
  renderInbox(); const next = $("changeSearch"); if (next) { next.focus(); try { next.setSelectionRange(pos, pos); } catch {} }
}

$("navTabs").addEventListener("click", e => { const b = e.target.closest("[data-view]"); if (b) setView(b.dataset.view); });
$("main").addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const action = el.dataset.action; const id = el.dataset.id;
  if (action === "open-change") { openChange(id); return; }
  if (action === "back-inbox" || action === "go-inbox") { setView("inbox"); return; }
  if (action === "go-sources") { setView("sources"); return; }
  if (action === "go-opps") { setView("opps"); return; }
  if (action === "filter-status") { state.filterStatus = el.dataset.value; renderInbox(); return; }
  if (action === "make-opp") { const c = changeOf(state.detailId); if (c) addOpportunity(c); return; }
  if (action === "save-note") { const c = changeOf(state.detailId); if (c) { c.note = $("detailNote").value; $("noteSaveStatus").textContent = "已更新原型内存状态 · 非持久化"; showToast("备注已更新到当前演示状态"); } return; }
  if (action === "test-source") { const s = sourceOf(id); if (s) { showToast("演示模式：未发起真实网络请求"); } return; }
  if (action === "toggle-source") { const s = sourceOf(id); if (s) { s.enabled = !s.enabled; render(); showToast(s.enabled ? "来源已在演示中启用" : "来源已在演示中停用"); } return; }
  if (action === "edit-source") { openSourceModal(id); return; }
  if (action === "add-source") { openSourceModal(); return; }
  if (action === "remove-source") { const s = sourceOf(id); if (s && confirm(`从演示列表移除“${s.name}”？这不会访问或删除真实数据。`)) { const i = sources.findIndex(x => x.id === id); if (i >= 0) sources.splice(i,1); render(); showToast("已从演示列表移除"); } return; }
  if (action === "opp-status") { const o = opportunityOf(id); if (o) { o.status = el.value || el.dataset.value; renderOpps(); showToast("机会状态已更新到演示状态"); } return; }
  if (action === "edit-opp") { const o = opportunityOf(id); if (!o) return; const title = prompt("机会标题", o.title); if (title === null) return; const question = prompt("待验证的问题", o.question); if (question === null) return; o.title = title.trim() || o.title; o.question = question.trim(); renderOpps(); showToast("机会记录已更新到演示状态"); return; }
});
$("main").addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches(".change-row[role='button']")) { e.preventDefault(); openChange(e.target.dataset.id); } });
$("main").addEventListener("input", e => { if (e.target.id === "changeSearch") updateSearch(e.target.value); });
$("main").addEventListener("change", e => {
  if (e.target.id === "sourceTypeFilter") { state.filterType = e.target.value; renderInbox(); }
  if (e.target.id === "changeSort") { state.sort = e.target.value; renderInbox(); }
  if (e.target.id === "detailStatus") { const c = changeOf(state.detailId); if (c) { c.status = e.target.value; renderDetail(); renderStatus(); } }
  if (e.target.matches("[data-action='opp-status']")) { const o = opportunityOf(e.target.dataset.id); if (o) { o.status = e.target.value; renderOpps(); showToast("机会状态已更新到演示状态"); } }
});
$("refreshBtn").addEventListener("click", () => {
  if (state.refreshing) return;
  state.refreshing = true; state.preview = "loading"; render();
  setTimeout(() => {
    state.refreshing = false;
    if (state.preview === "loading") state.preview = "normal";
    state.lastRefresh = "刚刚（演示）"; render(); showToast("演示刷新完成：未连接任何真实来源");
  }, 850);
});
$("sourceStatus").addEventListener("click", () => { setView("sources"); });
document.querySelectorAll("[data-theme]").forEach(el => el.addEventListener("click", () => { setTheme(el.dataset.theme); }));
document.querySelectorAll("[data-width]").forEach(el => el.addEventListener("click", () => { setWidth(el.dataset.width); }));
document.querySelectorAll("[data-preview]").forEach(el => el.addEventListener("click", () => { setPreview(el.dataset.preview); }));
$("sourceForm").addEventListener("submit", e => { e.preventDefault(); saveSource(e.currentTarget); });
$("closeModal").addEventListener("click", closeSourceModal);
$("cancelModal").addEventListener("click", closeSourceModal);
$("modalBackdrop").addEventListener("click", e => { if (e.target === $("modalBackdrop")) closeSourceModal(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("modalBackdrop").hidden) closeSourceModal(); });

render();
</script>
</body>
</html>
